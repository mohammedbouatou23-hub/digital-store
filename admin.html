
<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم DIGITAL MAROC™</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Arial}</style>
</head>
<body class="bg-[#0A1931] min-h-screen">

<!-- LOGIN -->
<div id="loginBox" class="min-h-screen flex justify-center items-center p-4">
  <form id="loginForm" class="bg-white p-8 rounded-[20px] w-full max-w-sm text-center shadow-2xl">
    <h2 class="text-black font-black text-2xl mb-2">DIGITAL MAROC™</h2>
    <p class="text-gray-500 text-sm mb-6">لوحة تحكم الإدارة</p>

    <input id="emailInput" type="email" required
      autocomplete="username"
      placeholder="البريد الإلكتروني"
      class="w-full p-4 border-2 rounded-xl text-black outline-none focus:border-yellow-400 text-center font-bold mb-3">

    <input id="passInput" type="password" required
      autocomplete="current-password"
      placeholder="كلمة السر"
      class="w-full p-4 border-2 rounded-xl text-black outline-none focus:border-yellow-400 text-center font-bold">

    <button id="loginBtn" type="submit"
      class="w-full mt-4 bg-[#0A1931] text-white py-4 rounded-xl font-black hover:bg-black transition">
      دخول 🔐
    </button>

    <p id="err" role="alert" class="text-red-500 text-xs mt-3 hidden"></p>
  </form>
</div>

<!-- PANEL -->
<div id="panel" class="hidden">
  <header class="bg-white p-4 flex justify-between items-center">
    <h1 class="font-black text-black">DIGITAL MAROC - ADMIN</h1>
    <button onclick="logoutAdmin()"
      class="text-xs bg-red-50 text-red-600 px-3 py-1 rounded-full font-bold">
      خروج
    </button>
  </header>

  <div class="flex gap-2 p-4 max-w-5xl mx-auto">
    <button id="tabLeadsBtn" onclick="showTab('leads')"
      class="flex-1 py-3 rounded-xl font-black bg-[#FFEB00] text-black">
      📞 العملاء (Leads)
    </button>
    <button id="tabReviewsBtn" onclick="showTab('reviews')"
      class="flex-1 py-3 rounded-xl font-black bg-white/10 text-white">
      ⭐ التعليقات
    </button>
  </div>

  <!-- LEADS TAB -->
  <div id="leadsTab" class="max-w-5xl mx-auto p-4">
    <div class="bg-white rounded-[20px] p-4 overflow-x-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-black text-black text-lg">لائحة العملاء - 0719380106</h2>
        <button onclick="loadLeads()"
          class="text-xs bg-black text-white px-4 py-2 rounded-full">
          تحديث 🔄
        </button>
      </div>

      <table class="w-full text-sm text-right">
        <thead>
          <tr class="border-b-2 font-black text-black">
            <th class="p-3">التاريخ</th>
            <th class="p-3">الاسم</th>
            <th class="p-3">الهاتف</th>
            <th class="p-3">العمر</th>
          </tr>
        </thead>
        <tbody id="leadsBody">
          <tr>
            <td colspan="4" class="p-8 text-center text-gray-400">
              ...كنجيبو العملاء
            </td>
          </tr>
        </tbody>
      </table>

      <p class="text-[11px] text-gray-400 mt-4 text-center">
        العملاء كيتسجلو فـ Google Sheet + Supabase.
        إلا ما بانو هنا شوف Google Sheet ديالك.
      </p>
    </div>
  </div>

  <!-- REVIEWS TAB -->
  <div id="reviewsTab" class="hidden max-w-5xl mx-auto p-4">
    <div class="bg-white rounded-[20px] p-4">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-black text-black text-lg">
          إدارة التعليقات - Play Store Style
        </h2>
        <button onclick="loadReviews()"
          class="text-xs bg-black text-white px-4 py-2 rounded-full">
          تحديث 🔄
        </button>
      </div>

      <div id="reviewsList" class="grid gap-3">
        <p class="text-center text-gray-400 p-8">...كنجيبو التعليقات</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://tonkzmlrdmhtekvqdsjh.supabase.co";
const SUPABASE_KEY = "sb_publishable_0EOeU0O5HcDd-dlMBGMVvA_P5Wkxg1f";

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// --- ADMIN LOGIN ---
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const errBox = document.getElementById('err');
  const loginBtn = document.getElementById('loginBtn');

  errBox.classList.add('hidden');
  loginBtn.disabled = true;
  loginBtn.textContent = 'جاري التحقق...';

  try {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passInput').value;

    const { error: loginError } = await supa.auth.signInWithPassword({
      email,
      password
    });

    if (loginError) throw loginError;

    const { data: isAdmin, error: adminError } =
      await supa.rpc('is_admin');

    if (adminError) throw adminError;

    if (isAdmin !== true) {
      await supa.auth.signOut();
      throw new Error('هاد الحساب ما عندوش صلاحية الإدارة.');
    }

    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');

    await loadLeads();
    await loadReviews();

  } catch (error) {
    errBox.textContent = error.message || 'فشل تسجيل الدخول.';
    errBox.classList.remove('hidden');
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'دخول 🔐';
  }
});

// --- LOGOUT ---
async function logoutAdmin() {
  const { error } = await supa.auth.signOut();

  if (error) {
    alert(error.message);
    return;
  }

  location.reload();
}

// --- TABS ---
function showTab(t) {
  document.getElementById('leadsTab').classList.toggle('hidden', t !== 'leads');
  document.getElementById('reviewsTab').classList.toggle('hidden', t !== 'reviews');

  document.getElementById('tabLeadsBtn').className =
    t === 'leads'
      ? "flex-1 py-3 rounded-xl font-black bg-[#FFEB00] text-black"
      : "flex-1 py-3 rounded-xl font-black bg-white/10 text-white";

  document.getElementById('tabReviewsBtn').className =
    t === 'reviews'
      ? "flex-1 py-3 rounded-xl font-black bg-[#FFEB00] text-black"
      : "flex-1 py-3 rounded-xl font-black bg-white/10 text-white";
}

// --- LEADS ---
async function loadLeads() {
  const body = document.getElementById('leadsBody');

  try {
    const res = await fetch('/api/save-lead');
    const json = await res.json();

    if (Array.isArray(json) && json.length > 0) {
      body.innerHTML = "";

      json.forEach(l => {
        body.innerHTML += `<tr class="border-b">
          <td class="p-3 text-xs">${l.تاريخ || l.date || ''}</td>
          <td class="p-3 font-bold">${l.اسم || l.name || l.مقد || ''}</td>
          <td class="p-3">
            <a href="https://wa.me/${l.هاتف || l.phone}"
              class="text-green-600 font-bold underline">
              ${l.هاتف || l.phone || ''}
            </a>
          </td>
          <td class="p-3">${l.عمر || l.age || ''}</td>
        </tr>`;
      });

      return;
    }
  } catch (e) {}

  // Fallback: Supabase leads table
  try {
    const { data, error } = await supa
      .from("leads")
      .select("*")
      .order("created_at", { ascending: false });

    if (!error && data && data.length > 0) {
      body.innerHTML = "";

      data.forEach(l => {
        body.innerHTML += `<tr class="border-b">
          <td class="p-3 text-xs">${new Date(l.created_at).toLocaleString('ar-MA')}</td>
          <td class="p-3 font-bold">${l.name || ''}</td>
          <td class="p-3">
            <a href="https://wa.me/${l.phone}"
              class="text-green-600 font-bold underline">
              ${l.phone || ''}
            </a>
          </td>
          <td class="p-3">${l.age || ''}</td>
        </tr>`;
      });

      return;
    }
  } catch (e) {}

  body.innerHTML = `<tr>
    <td colspan="4" class="p-8 text-center text-gray-400">
      ما كاين حتى عميل دابا - العملاء كاينين ف Google Sheet
      <br>
      <a href="https://docs.google.com/spreadsheets/"
        target="_blank" rel="noopener noreferrer"
        class="underline text-blue-600">
        فتح Google Sheet
      </a>
    </td>
  </tr>`;
}

// --- REVIEWS ---
async function loadReviews() {
  const box = document.getElementById('reviewsList');

  box.innerHTML =
    '<p class="text-center text-gray-400 p-8">...كنجيبو التعليقات</p>';

  const { data, error } = await supa
    .from("reviews")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    box.innerHTML = `<p class="text-center text-red-500 p-8">
      تعذر تحميل التعليقات: ${error.message}
    </p>`;
    return;
  }

  box.innerHTML = "";

  if (!data || data.length === 0) {
    box.innerHTML =
      '<p class="text-center text-gray-400 p-8">ما كاين حتى تعليق</p>';
    return;
  }

  data.forEach(r => {
    const card = document.createElement('div');
    card.className =
      "border p-4 rounded-xl flex justify-between items-start gap-3";

    const content = document.createElement('div');
    content.className = "flex-1 text-right";

    const author = document.createElement('b');
    author.className = "text-black";
    author.textContent = r.name || '';

    const rating = document.createElement('span');
    rating.style.color = "#D4A900";
    rating.textContent = " " + "★".repeat(
      Math.max(0, Math.min(5, Number(r.stars) || 0))
    );

    const comment = document.createElement('p');
    comment.className = "text-sm text-gray-700 mt-1";
    comment.textContent = r.comment || '';

    const date = document.createElement('p');
    date.className = "text-[10px] text-gray-400 mt-1";
    date.textContent =
      (r.created_at ? new Date(r.created_at).toLocaleString('ar-MA') : '') +
      " - ID: " + String(r.id).slice(0, 8);

    content.append(author, rating, comment, date);

    const deleteBtn = document.createElement('button');
    deleteBtn.className =
      "bg-red-500 text-white px-4 py-2 rounded-full text-xs font-bold shrink-0";
    deleteBtn.textContent = "مسح 🗑️";
    deleteBtn.addEventListener('click', () => deleteReview(r.id));

    card.append(content, deleteBtn);
    box.appendChild(card);
  });
}

// --- DELETE REVIEW ---
async function deleteReview(id) {
  if (!confirm("واش بغيتي تمسح هاد التعليق نهائيا من Supabase؟")) {
    return;
  }

  const { error } = await supa
    .from("reviews")
    .delete()
    .eq("id", id);

  if (error) {
    alert("ما قدرناش نمسحو التعليق: " + error.message);
  } else {
    await loadReviews();
  }
}
</script>
</body>
</html>
