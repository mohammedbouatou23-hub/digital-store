document.documentElement.dir=lang==='ar'?'rtl':'ltr';
document.querySelectorAll('[id^=btn-]').forEach(b=>b.classList.remove('lang-active'));
document.getElementById('btn-'+lang).classList.add('lang-active');
document.querySelectorAll('[data-i18n]').forEach(el=>{let k=el.getAttribute('data-i18n');if(i18n[lang][k])el.innerHTML=i18n[lang][k];});
let ph=document.getElementById('searchInput'); if(ph){ph.placeholder=i18n[lang].search_placeholder;}
let hero=document.getElementById('heroBox');
if(lang==='ar'){hero.classList.remove('items-start','text-left');hero.classList.add('items-end','text-right');}
else{hero.classList.remove('items-end','text-right');hero.classList.add('items-start','text-left');}
render();
if(isSearching) doSearch();
}

function render(){
if(isSearching) return;
document.getElementById('cats').innerHTML=DATA.map((d,i)=>`<button onclick="setCat(${i})" class="px-3 py-1.5 rounded-full text-[10px] font-black border ${i==activeIndex?'cat-active':''}">${d.cat[currentLang]}</button>`).join('');
document.getElementById('catInfo').innerText=DATA[activeIndex].cat[currentLang];
document.getElementById('buyCat').innerText=i18n[currentLang].buy_cat;
document.getElementById('buyCat').onclick=()=>{window.open(`https://wa.me/${WA}?text=${encodeURIComponent(DATA[activeIndex].cat[currentLang]+' - 49 DH')}`,'_blank');};
document.getElementById('books').innerHTML=DATA[activeIndex].items.map((t,i)=>{
let sales=15+Math.floor(Math.random()*400);
let rating=(4.2+Math.random()*0.7).toFixed(1);
return `<div onclick="openModal('${t[currentLang].replace(/'/g,"\\'")}')" class="border rounded-[14px] p-3 hover:border-black cursor-pointer bg-white"><div class="flex justify-between"><span class="text-[8px] bg-[#f6f6f6] px-2 py-0.5 rounded-full">#${i+1}</span><span class="text-[9px] bg-green-500 text-white px-2 py-0.5 rounded-full font-black">19 DH</span></div><p class="font-black text-[11px] mt-2 leading-tight h-[40px] overflow-hidden">${t[currentLang]}</p><div class="flex items-center gap-1 mt-2"><span class="text-[9px]">⭐ ${rating}</span><span class="text-[8px] bg-[#f6f6f6] px-1.5 py-0.5 rounded-full">${sales} ${i18n[currentLang].downloads}</span></div></div>`;
}).join('');
}

// 🔍 دالة البحث الجديدة - كتقلب فـ 2000 قالب كامل
function doSearch(){
let q=document.getElementById('searchInput').value.trim().toLowerCase();
let resultInfo=document.getElementById('searchResult');
if(q.length===0){
isSearching=false;
resultInfo.classList.add('hidden');
render();
return;
}
isSearching=true;
let allItems=[];
DATA.forEach(catData=>{
catData.items.forEach(item=>{
let name=item[currentLang].toLowerCase();
let catName=catData.cat[currentLang].toLowerCase();
if(name.includes(q) || catName.includes(q)){
allItems.push({cat:catData.cat[currentLang], item:item});
}
});
});
if(allItems.length>0){
resultInfo.classList.remove('hidden');
resultInfo.innerHTML=`${i18n[currentLang].search_found} <span class="bg-black text-white px-2 py-0.5 rounded-full">${allItems.length}</span> ${i18n[currentLang].search_result} لـ "${q}"`;
document.getElementById('catInfo').innerText=`🔍 نتائج البحث: ${allItems.length}`;
document.getElementById('books').innerHTML=allItems.map((obj,i)=>{
let sales=15+Math.floor(Math.random()*400);
let rating=(4.2+Math.random()*0.7).toFixed(1);
return `<div onclick="openModal('${obj.item[currentLang].replace(/'/g,"\\'")}')" class="border-2 border-black rounded-[14px] p-3 hover:bg-zinc-50 cursor-pointer bg-white"><div class="flex justify-between"><span class="text-[8px] bg-black text-white px-2 py-0.5 rounded-full">${obj.cat}</span><span class="text-[9px] bg-green-500 text-white px-2 py-0.5 rounded-full font-black">19 DH</span></div><p class="font-black text-[11px] mt-2 leading-tight">${obj.item[currentLang]}</p><div class="flex items-center gap-1 mt-2"><span class="text-[9px]">⭐ ${rating}</span><span class="text-[8px] bg-[#f6f6f6] px-1.5 py-0.5 rounded-full">${sales} ${i18n[currentLang].downloads}</span></div></div>`;
}).join('');
}else{
resultInfo.classList.remove('hidden');
resultInfo.innerHTML=`❌ ${i18n[currentLang].search_no} "${q}"`;
document.getElementById('catInfo').innerText=`🔍 0 نتيجة`;
document.getElementById('books').innerHTML=`<div class="col-span-4 text-center py-10 border-2 border-dashed rounded-[20px]"><p class="font-black">😔 ما لقيناش "${q}"</p><p class="text-[11px] text-zinc-500 mt-1">جرب كلمة أخرى: CV، قفطان، عقار، مطعم...</p><button onclick="clearSearch()" class="mt-3 bg-black text-white px-4 py-2 rounded-full text-[11px] font-black">مسح البحث</button></div>`;
}
}

function clearSearch(){
document.getElementById('searchInput').value='';
doSearch();
}

function setCat(i){activeIndex=i; if(isSearching){clearSearch();} render();}
function openModal(title){
document.getElementById('modalBook').innerText=title;
document.getElementById('modalStats').innerHTML=`<span class="bg-black text-white px-3 py-1 rounded-full text-[11px] font-black">19 DH - ${i18n[currentLang].downloads}</span>`;
document.getElementById('modalBuy').innerText=i18n[currentLang].buy_one;
document.getElementById('modalBuy').onclick=()=>{window.open(`https://wa.me/${WA}?text=${encodeURIComponent(title+' - 19 DH')}`,'_blank');};
document.getElementById('modal').classList.remove('hidden');
}
setLang(currentLang);
</script>
</body>
</html>
