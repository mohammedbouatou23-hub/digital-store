function generateData(){
 return categoriesMeta.map(cat=>{
   let items=[];
   for(let i=0;i<100;i++){
     let baseIdx=i%10;
     let num=Math.floor(i/10)+1;
     let style = num===1? "" : ` - Style ${num}`;
     items.push({
       ar: `${cat.basesAr[baseIdx]}${style} #${i+1}`,
       fr: `${cat.basesFr[baseIdx]}${style} #${i+1}`,
       en: `${cat.basesEn[baseIdx]}${style} #${i+1}`
     });
   }
   return {cat:{ar:cat.ar, fr:cat.fr, en:cat.en}, items:items};
 });
}
