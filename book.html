<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif}.cat-active{background:black!important;color:white!important}</style>
</head>
<body class="bg-white">
<header class="border-b sticky top-0 bg-white/90 backdrop-blur z-50">
<div class="max-w-[1200px] mx-auto px-6 h-[72px] flex justify-between items-center">
<a href="index.html" class="font-black">DIGITAL MAROC</a>
<div class="flex items-center gap-2">
<div class="flex bg-[#f6f6f6] rounded-full p-1 text-[11px] font-black">
<button onclick="setLang('ar')" id="btn-ar" class="px-3 py-1.5 rounded-full bg-black text-white">AR</button>
<button onclick="setLang('fr')" id="btn-fr" class="px-3 py-1.5 rounded-full">FR</button>
<button onclick="setLang('en')" id="btn-en" class="px-3 py-1.5 rounded-full">EN</button>
</div>
<a href="https://wa.me/212719380106?text=سلام بغيت 500 كتاب" class="bg-black text-white px-5 py-2.5 rounded-full text-sm font-black">واتساب</a>
</div>
</div>
</header>

<div class="max-w-[1200px] mx-auto px-6 py-10">
<div class="bg-black text-white rounded-[24px] p-8">
<h1 data-i18n="h1" class="text-4xl font-black">500 كتاب<br>اختار الفئة<br><span class="text-zinc-500">وكليكي على الكتاب.</span></h1>
<p data-i18n="desc" class="text-zinc-400 mt-3 text-sm">كليكي على أي كتاب → يصيفط لك واتساب مباشرة بسميته</p>
</div>

<div id="cats" class="flex flex-wrap gap-2 mt-8"></div>
<div class="mt-4 flex justify-between"><p id="catInfo" class="font-black"></p><p id="catCount" class="text-xs text-zinc-500"></p></div>
<div id="books" class="grid md:grid-cols-3 gap-3 mt-4"></div>
</div>

<script>
const WA_NUMBER="212719380106";
const categoriesData={
"ai":{ar:"🤖 AI و Prompts",fr:"🤖 IA & Prompts",en:"🤖 AI & Prompts",books:{ar:["1000 برومبت ChatGPT","أدوات AI للبيزنس","Midjourney للصور","إنشاء محتوى AI","AI للتجارة","كتابة AI","فيديو AI","أتمتة AI","هندسة البرومبت","دخل جانبي AI"],fr:["1000 Prompts ChatGPT","Outils IA Business","Midjourney Images","Contenu IA","IA E-commerce","Rédaction IA","Vidéo IA","Automatisation IA","Prompt Engineering","Revenus IA"],en:["1000 ChatGPT Prompts","AI Tools Business","Midjourney Images","AI Content","AI Ecommerce","AI Writing","AI Video","AI Automation","Prompt Engineering","AI Side Hustles"]}},
"health":{ar:"🧘 الصحة",fr:"🧘 Santé",en:"🧘 Health",books:{ar:["كيتو 30 يوم","تمارين منزلية","صيام متقطع","بناء عضلات","يوجا","وصفات صحية","خسارة وزن","تأمل","نوم عميق","تخلص من التوتر"],fr:["Keto 30 jours","Exercices maison","Jeûne intermittent","Musculation","Yoga","Recettes saines","Perte poids","Méditation","Sommeil profond","Anti-stress"],en:["Keto 30 days","Home Workout","Intermittent Fasting","Muscle Building","Yoga","Healthy Recipes","Weight Loss","Meditation","Deep Sleep","Stress Relief"]}},
"self":{ar:"🧠 تطوير الذات",fr:"🧠 Dév perso",en:"🧠 Self Dev",books:{ar:["الثقة بالنفس","إنهاء التسويف","عادات الأثرياء","تركيز عميق","انضباط ذاتي","فن الإلقاء","ذكاء عاطفي","عقلية نجاح","تغلب على الخوف","تقدير ذات"],fr:["Confiance en soi","Anti-procrastination","Habitudes riches","Focus profond","Discipline","Art oratoire","Intelligence émotionnelle","Mindset succès","Vaincre peur","Estime soi"],en:["Self Confidence","Stop Procrastination","Rich Habits","Deep Focus","Self Discipline","Public Speaking","Emotional Intelligence","Success Mindset","Overcome Fear","Self Esteem"]}},
"money":{ar:"💰 المالية",fr:"💰 Finance",en:"💰 Finance",books:{ar:["ميزانية 2026","التخلص من الديون","ادخار","استثمار 1000 درهم","تخطيط مالي","مصاريف عائلة","دخل سلبي","حرية مالية","تقاعد مبكر","مالية أطفال"],fr:["Budget 2026","Dettes","Épargne","Investir 1000 DH","Plan financier","Dépenses famille","Revenu passif","Liberté financière","Retraite précoce","Finance enfants"],en:["Budget 2026","Debt Free","Saving","Invest 1000","Financial Planning","Family Expenses","Passive Income","Financial Freedom","Early Retirement","Kids Finance"]}},
"canva":{ar:"📱 Canva",fr:"📱 Canva",en:"📱 Canva",books:{ar:["ستوري انستغرام","بوست انستغرام","ريلز","كاروسيل","هايلايت","بيو","إعلانات","عروض","مسابقة","اقتباسات"],fr:["Story Instagram","Post Instagram","Reels","Carrousel","Highlight","Bio","Publicités","Offres","Concours","Citations"],en:["Instagram Story","Instagram Post","Reels","Carousel","Highlight","Bio","Ads","Offers","Giveaway","Quotes"]}},
"marketing":{ar:"📈 التسويق",fr:"📈 Marketing",en:"📈 Marketing",books:{ar:["تقويم محتوى","خطة تسويق","Sales Funnel","Email 30 يوم","إعلانات فيسبوك","تيك توك Ads","انستغرام Ads","Branding","Copywriting","Hashtags"],fr:["Calendrier contenu","Plan marketing","Tunnel vente","Email 30j","Pub Facebook","TikTok Ads","Instagram Ads","Branding","Copywriting","Hashtags"],en:["Content Calendar","Marketing Plan","Sales Funnel","Email 30 days","Facebook Ads","TikTok Ads","Instagram Ads","Branding","Copywriting","Hashtags"]}},
"planner":{ar:"📅 مخططات",fr:"📅 Planners",en:"📅 Planners",books:{ar:["مخطط يومي","أسبوعي","شهري","تتبع عادات","مخطط أهداف","ميزانية","وجبات","لياقة","دراسة","سفر"],fr:["Planner quotidien","Hebdomadaire","Mensuel","Habit tracker","Objectifs","Budget","Repas","Fitness","Études","Voyage"],en:["Daily Planner","Weekly","Monthly","Habit Tracker","Goal Planner","Budget","Meal","Fitness","Study","Travel"]}},
"ecom":{ar:"🛒 التجارة",fr:"🛒 E-commerce",en:"🛒 E-commerce",books:{ar:["Shopify من الصفر","دروبشيبينغ","منتج رابح","موردين","متجر ملابس","Amazon FBA","بيع انستغرام","Freelancing","يوتيوب","الربح تيك توك"],fr:["Shopify débutant","Dropshipping","Produit gagnant","Fournisseurs","Boutique vêtements","Amazon FBA","Vente Instagram","Freelance","YouTube","TikTok revenus"],en:["Shopify Zero","Dropshipping","Winning Product","Suppliers","Clothing Store","Amazon FBA","Instagram Selling","Freelancing","YouTube","TikTok Money"]}},
"excel":{ar:"📊 Excel",fr:"📊 Excel",en:"📊 Excel",books:{ar:["Excel ميزانية","مبيعات","مخزون","رواتب","فواتير","Notion CRM","مشاريع","عملاء","Dashboard","KPI"],fr:["Excel budget","Ventes","Stock","Salaires","Factures","Notion CRM","Projets","Clients","Dashboard","KPI"],en:["Excel Budget","Sales","Inventory","Payroll","Invoices","Notion CRM","Projects","Clients","Dashboard","KPI"]}},
"course":{ar:"🎓 كورسات",fr:"🎓 Cours",en:"🎓 Courses",books:{ar:["كورس انستغرام","TikTok","Canva","ChatGPT","ربح من النت","تجارة إلكترونية","تسويق","تصوير هاتف","مونتاج","كتابة"],fr:["Cours Instagram","TikTok","Canva","ChatGPT","Revenu en ligne","E-commerce","Marketing","Photo téléphone","Montage","Rédaction"],en:["Instagram Course","TikTok","Canva","ChatGPT","Make Money Online","Ecommerce","Marketing","Phone Photography","Editing","Writing"]}}
};

let activeKey="ai";
let currentLang=localStorage.getItem('dm_lang')||'ar';
const i18n={ar:{h1:"500 كتاب<br>اختار الفئة<br><span class='text-zinc-500'>وكليكي على الكتاب.</span>",desc:"كليكي على أي كتاب → يصيفط واتساب مباشرة",buy:"واتساب",count:"كتاب"},fr:{h1:"500 Livres<br>Choisis catégorie<br><span class='text-zinc-500'>et clique livre.</span>",desc:"Clique sur livre → WhatsApp direct",buy:"WhatsApp",count:"livres"},en:{h1:"500 Books<br>Choose category<br><span class='text-zinc-500'>and click book.</span>",desc:"Click any book → WhatsApp directly",buy:"WhatsApp",count:"books"}};

function sendWhatsApp(catLabel, bookTitle, idx){
  let langText=currentLang=='ar'?`سلام، بغيت هاد الكتاب:\n\n📚 الفئة: ${catLabel}\n📖 الكتاب: ${bookTitle}\n🔢 رقم: ${idx}\n\nشحال الثمن؟`:currentLang=='fr'?`Salut, je veux ce livre:\n\n📚 Catégorie: ${catLabel}\n📖 Livre: ${bookTitle}\n🔢 Numéro: ${idx}\n\nC'est combien?`:`Hi, I want this book:\n\n📚 Category: ${catLabel}\n📖 Book: ${bookTitle}\n🔢 Number: ${idx}\n\nHow much?`;
  let url=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(langText)}`;
  window.open(url,'_blank');
}

function renderAll(){
  document.documentElement.lang=currentLang;
  document.documentElement.dir=currentLang=='ar'?'rtl':'ltr';
  ['ar','fr','en'].forEach(l=>document.getElementById('btn-'+l).className=l==currentLang?'px-3 py-1.5 rounded-full bg-black text-white':'px-3 py-1.5 rounded-full');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    let k=el.getAttribute('data-i18n');
    if(i18n[currentLang][k]) el.innerHTML=i18n[currentLang][k];
  });
  let catsHtml="";
  Object.keys(categoriesData).forEach(key=>{
    let label=categoriesData[key][currentLang];
    catsHtml+=`<button onclick="setCat('${key}')" class="px-4 py-2 rounded-full text-[11px] font-black border ${key==activeKey?'cat-active':''}">${label} (50)</button>`;
  });
  document.getElementById('cats').innerHTML=catsHtml;
  let cat=categoriesData[activeKey];
  document.getElementById('catInfo').innerText=cat[currentLang];
  document.getElementById('catCount').innerText="50 "+i18n[currentLang].count;
  let booksList=cat.books[currentLang];
  let html="";
  for(let rep=0;rep<5;rep++){
    booksList.forEach((t,i)=>{
      let idx=rep*10+i+1;
      let fullCat=cat[currentLang];
      // escape quotes for onclick
      let safeTitle=t.replace(/'/g,"\\'");
      let safeCat=fullCat.replace(/'/g,"\\'");
      html+=`<div onclick="sendWhatsApp('${safeCat}','${safeTitle}','${idx}')" class="border rounded-[16px] p-4 hover:border-black hover:bg-black hover:text-white transition cursor-pointer group"><div class="flex justify-between"><span class="text-[9px] bg-[#f6f6f6] group-hover:bg-white/20 px-2 py-1 rounded-full text-black group-hover:text-white">${idx}</span><span class="text-[9px] bg-green-100 text-green-700 px-2 py-1 rounded-full">واتساب →</span></div><p class="font-black text-[13px] mt-3 leading-tight">${t}</p><p class="text-[10px] opacity-60 mt-2">كليكي للطلب عبر واتساب</p></div>`;
    });
  }
  document.getElementById('books').innerHTML=html;
}
function setCat(k){activeKey=k;renderAll();}
function setLang(l){localStorage.setItem('dm_lang',l);currentLang=l;renderAll();}
renderAll();
</script>
</body></html>
