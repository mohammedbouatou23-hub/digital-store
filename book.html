function getSmartStats(title,index){let hot=["chatgpt","midjourney","shopify","canva","tiktok","instagram","amazon","fba","funnel","ads","seo","ai ","notion","excel"].some(k=>title.toLowerCase().includes(k));if(hot||index<5){return{sales:310+Math.floor(Math.random()*210),rating:(4.8+Math.random()*0.2).toFixed(1),stars:"⭐⭐⭐⭐⭐",badge:"🔥"};}else if(index<15){return{sales:85+Math.floor(Math.random()*110),rating:(4.3+Math.random()*0.4).toFixed(1),stars:"⭐⭐⭐⭐",badge:"👍"};}else{return{sales:12+Math.floor(Math.random()*48),rating:(3.2+Math.random()*0.9).toFixed(1),stars:"⭐⭐⭐",badge:""};}}
function setLang(lang){currentLang=lang;localStorage.setItem('dm_lang',lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[id^=btn-]').forEach(b=>b.classList.remove('lang-active'));document.getElementById('btn-'+lang).classList.add('lang-active');document.querySelectorAll('[data-i18n]').forEach(el=>{let k=el.getAttribute('data-i18n');if(i18n[lang][k])el.innerHTML=i18n[lang][k];});document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{let k=el.getAttribute('data-i18n-placeholder');if(i18n[lang][k])el.placeholder=i18n[lang][k];});active=Object.keys(booksData[currentLang])[0];render();}
function render(){if(isSearching)return;document.getElementById('cats').innerHTML=Object.keys(booksData[currentLang]).map(c=>`<button onclick="setCat('${c.replace(/'/g,"\\'")}')" class="px-4 py-2 rounded-full text-[11px] font-black border ${c==active?'cat-active':''}">${c}</button>`).join('');document.getElementById('catInfo').innerText=active;document.getElementById('books').innerHTML=booksData[currentLang][active].map((t,i)=>{const s=getSmartStats(t,i);const cov=getCoverForCat(active);return `<div onclick="openModal('${active.replace(/'/g,"\\'")}','${t.replace(/'/g,"\\'")}','${i+1}')" class="book-card"><div class="flex justify-between px-3 py-2 bg-[#fafafa]"><span class="text-[9px] bg-white border px-2 py-1 rounded-full">#${i+1} ${s.badge}</span><div class="flex items-center gap-1"><span class="text-[9px] line-through text-zinc-400">30 DH</span><span class="text-[10px] bg-green-500 text-white px-2 py-1 rounded-full font-black">19 DH</span></div></div><div class="book-cover" style="background:${cov.bg}"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:70px;opacity:0.15">${cov.icon}</div><div class="book-cover-overlay"></div><div class="book-cover-title">${t}</div></div><div class="p-3"><div class="flex items-center gap-2 mt-1"><span class="text-[11px]">${s.stars}</span><span class="text-[10px] font-black">${s.rating}</span><span class="text-[9px] bg-[#f6f6f6] px-2 py-0.5 rounded-full">${s.sales} ${i18n[currentLang].downloads}</span></div></div></div>`;}).join('');}
function setCat(c){active=c;if(isSearching)clearSearch();render();}
function openModal(cat,title,num){const s=getSmartStats(title,parseInt(num));const cov=getCoverForCat(cat);document.getElementById('modalCover').innerHTML=`<div style="width:100%;height:100%;background:${cov.bg};display:flex;align-items:center;justify-content:center;position:relative"><div style="font-size:60px;opacity:0.2">${cov.icon}</div><div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.8),transparent)"></div><div style="position:absolute;bottom:10px;left:10px;right:10px;color:white;font-weight:900;text-align:center;font-size:13px">${title}</div></div>`;document.getElementById('modalBook').innerText=title;document.getElementById('modalStats').innerHTML=`<div class="flex flex-wrap gap-2 mt-2"><span class="bg-[#f6f6f6] px-3 py-1 rounded-full text-[11px] font-black">${s.stars} ${s.rating}</span><span class="bg-green-50 text-green-700 border px-3 py-1 rounded-full text-[11px] font-black">🔥 ${s.sales} مبيعة</span><div class="flex items-center gap-1"><span class="line-through text-[11px] text-zinc-400">30 DH</span><span class="bg-black text-white px-3 py-1 rounded-full text-[11px] font-black">19 DH</span><span class="bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded-full">-36%</span></div></div>`;document.getElementById('modalBuy').innerHTML=`<span class="line-through text-[11px] opacity-60 mr-2">30 DH</span> اطلب دابا - 19 DH ↗`;document.getElementById('modalBuy').onclick=()=>{window.open(`https://wa.me/${WA}?text=${encodeURIComponent(cat+" - "+title+" - 19 DH بدل 30 DH")}`,'_blank');};document.getElementById('modal').classList.remove('hidden');}
function doSearch(){let q=document.getElementById('searchInput').value.trim().toLowerCase();let resultInfo=document.getElementById('searchResult');let suggBox=document.getElementById('suggestions');if(q.length===0){isSearching=false;resultInfo.classList.add('hidden');suggBox.classList.add('hidden');render();return;}let allBooks=[];Object.keys(booksData[currentLang]).forEach(cat=>{booksData[currentLang][cat].forEach((title,idx)=>{if(title.toLowerCase().includes(q)){allBooks.push({cat,title,idx});}});});if(allBooks.length>0&&q.length>=1){suggBox.classList.remove('hidden');suggBox.innerHTML=allBooks.slice(0,5).map(obj=>`<div onclick="selectSuggestion('${obj.title.replace(/'/g,"\\'")}')" class="px-4 py-3 hover:bg-zinc-100 cursor-pointer flex justify-between items-center border-b last:border-0"><div class="flex items-center gap-3"><span class="bg-[#f6f6f6] w-7 h-7 rounded-full flex items-center justify-center text-[12px]">🔍</span><div><p class="font-bold text-[13px]">${obj.title}</p><p class="text-[10px] text-zinc-500">${obj.cat}</p></div></div><div class="flex items-center gap-1"><span class="line-through text-[9px] text-zinc-400">30</span><span class="text-[10px] bg-black text-white px-2 py-1 rounded-full">19 DH</span></div></div>`).join('');}else{suggBox.classList.add('hidden');}isSearching=true;if(allBooks.length>0){resultInfo.classList.remove('hidden');resultInfo.innerHTML=`${i18n[currentLang].search_found} <span class="bg-black text-white px-2 py-0.5 rounded-full">${allBooks.length}</span> ${i18n[currentLang].search_result}`;document.getElementById('catInfo').innerText=`🔍 ${allBooks.length} كتاب`;document.getElementById('books').innerHTML=allBooks.map(obj=>{const s=getSmartStats(obj.title,obj.idx);const cov=getCoverForCat(obj.cat);return `<div onclick="openModal('${obj.cat.replace(/'/g,"\\'")}','${obj.title.replace(/'/g,"\\'")}','${obj.idx}')" class="book-card border-2 border-black"><div class="flex justify-between px-3 py-2 bg-[#fafafa]"><span class="text-[8px] bg-black text-white px-2 py-1 rounded-full">${obj.cat}</span><div class="flex items-center gap-1"><span class="line-through text-[9px] text-zinc-400">30 DH</span><span class="text-[10px] bg-green-500 text-white px-2 py-1 rounded-full font-black">19 DH</span></div></div><div class="book-cover" style="background:${cov.bg}"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;opacity:0.15">${cov.icon}</div><div class="book-cover-overlay"></div><div class="book-cover-title">${obj.title}</div></div><div class="p-2"><p class="font-black text-[12px]">${obj.title}</p></div></div>`;}).join('');}else{resultInfo.classList.remove('hidden');resultInfo.innerHTML=`❌ ${i18n[currentLang].search_no} "${q}"`;document.getElementById('books').innerHTML=`<div class="col-span-3 text-center py-12 border-2 border-dashed rounded-[20px]"><p class="font-black">😔 ما لقيناش "${q}"</p><button onclick="clearSearch()" class="mt-3 bg-black text-white px-5 py-2 rounded-full text-[11px] font-black">مسح البحث</button></div>`;}}
function selectSuggestion(title){document.getElementById('searchInput').value=title;document.getElementById('suggestions').classList.add('hidden');doSearch();}
function clearSearch(){document.getElementById('searchInput').value='';document.getElementById('suggestions').classList.add('hidden');doSearch();}
document.addEventListener('click',e=>{if(!e.target.closest('#searchInput')&&!e.target.closest('#suggestions')){document.getElementById('suggestions').classList.add('hidden');}});
setLang(currentLang);
</script></body></html>
