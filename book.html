let active=Object.keys(booksData[currentLang])[0];
function getSmartStats(t,i){let hot=["chatgpt","midjourney","shopify","canva","tiktok","instagram","amazon","fba","funnel","ads","seo","ai ","notion","excel"].some(k=>t.toLowerCase().includes(k));if(hot||i<5)return{sales:310+Math.floor(Math.random()*210),rating:(4.8+Math.random()*0.2).toFixed(1),stars:"⭐⭐⭐⭐⭐",badge:"🔥"};else if(i<15)return{sales:85+Math.floor(Math.random()*110),rating:(4.3+Math.random()*0.4).toFixed(1),stars:"⭐⭐⭐⭐",badge:"👍"};else return{sales:12+Math.floor(Math.random()*48),rating:(3.2+Math.random()*0.9).toFixed(1),stars:"⭐⭐⭐",badge:""};}
function t(k){return i18n[currentLang][k]||k;}
function setLang(lang){currentLang=lang;localStorage.setItem('dm_lang',lang);document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[id^=btn-]').forEach(b=>b.classList.remove('lang-active'));document.getElementById('btn-'+lang).classList.add('lang-active');document.querySelectorAll('[data-i18n]').forEach(el=>{let key=el.getAttribute('data-i18n');if(i18n[lang][key])el.innerHTML=i18n[lang][key];});document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{let key=el.getAttribute('data-i18n-placeholder');if(i18n[lang][key])el.placeholder=i18n[lang][key];});active=Object.keys(booksData[currentLang])[0];render();}
function render(){if(window._searching)return;
document.getElementById('cats').innerHTML=Object.keys(booksData[currentLang]).map(c=>{const cover=getCoverForCat(c);const isActive=c==active;return `<div onclick="setCat('${c.replace(/'/g,"\\'")}')" class="cursor-pointer rounded-[14px] overflow-hidden border-2 ${isActive?'border-black shadow-xl':'border-zinc-200'} bg-white"><div class="folder-img-wrap"><img src="${cover}" loading="lazy"><div class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/70 to-transparent text-white text-right"><p class="font-black text-[11px]">${c}</p></div>${isActive?`<div class="absolute top-2 right-2 bg-white text-black text-[7px] font-black px-2 py-1 rounded-full">${t('active')}</div>`:''}</div></div>`;}).join('');
const allBooks=booksData[currentLang][active];document.getElementById('catInfo').innerText=active;document.getElementById('catCount').innerText=allBooks.length+" "+t('books');const activeCover=getCoverForCat(active);
document.getElementById('books').innerHTML=allBooks.map((b,i)=>{const s=getSmartStats(b,i);return `<div onclick="openModal('${active.replace(/'/g,"\\'")}','${b.replace(/'/g,"\\'")}','${i+1}')" class="book-card"><div class="flex justify-between px-2 py-1.5 bg-[#fafafa]"><span class="text-[8px] border bg-white px-1.5 py-0.5 rounded-full">#${i+1} ${s.badge}</span><span class="text-[9px] bg-green-500 text-white px-1.5 py-0.5 rounded-full font-black">19 DH</span></div><div class="book-cover"><img src="${activeCover}" loading="lazy"><div class="book-cover-overlay"></div><div class="book-cover-title">${b}</div></div><div class="px-1.5 py-1 flex justify-between"><span class="text-[9px]">${s.stars} ${s.rating}</span><span class="text-[7px] bg-[#f6f6f6] px-1 py-0.5 rounded-full">${s.sales}</span></div></div>`;}).join('');
const allCats=Object.keys(booksData[currentLang]);
document.getElementById('discover').innerHTML=`
<div class="bg-black rounded-[28px] p-6 md:p-8 text-white relative overflow-hidden">
  <div class="absolute -top-20 -right-20 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-20 -left-20 w-64 h-64 bg-green-500/20 rounded-full blur-3xl"></div>
  <div class="relative z-10">
    <div class="flex flex-col md:flex-row justify-between gap-4 items-start md:items-center">
      <div class="text-right">
        <h2 class="font-black text-[22px] md:text-[26px]" data-i18n="discover_title">${t('discover_title')}</h2>
        <p class="text-white/60 text-[12px] mt-2 max-w-[500px]" data-i18n="discover_sub">${t('discover_sub')}</p>
      </div>
      <button onclick="scrollToTop()" class="bg-white text-black px-5 py-2.5 rounded-full font-black text-[11px]">⬆️ ${currentLang==='ar'?'الفوق' : currentLang==='fr'?'Haut':'Top'}</button>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mt-6">
      ${allCats.map(c=>{
        const cover=getCoverForCat(c);
        const isActive=c==active;
        return `<div onclick="setCat('${c.replace(/'/g,"\\'")}')" class="cat-discover group ${isActive?'!border-white!border-2':''}">
          <img src="${cover}" loading="lazy">
          <div class="grad"></div>
          <div class="absolute bottom-0 left-0 right-0 p-2.5 text-right">
            <p class="font-black text-[11px] text-white leading-tight">${c}</p>
            <p class="text-[8px] text-white/70 mt-1">50 ${t('books')} • 49 DH</p>
          </div>
          ${isActive?`<div class="absolute top-2 right-2 bg-white text-black text-[7px] font-black px-2 py-1 rounded-full">${t('active')}</div>`:''}
          <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition flex items-center justify-center opacity-0 group-hover:opacity-100"><span class="bg-white text-black px-3 py-1.5 rounded-full font-black text-[10px]">👁️ ${currentLang==='ar'?'شوف' : currentLang==='fr'?'Voir':'View'}</span></div>
        </div>`;
      }).join('')}
    </div>
  </div>
</div>`;
}
function setCat(c){active=c;if(window._searching)clearSearch();render();setTimeout(()=>{document.getElementById('books').scrollIntoView({behavior:'smooth',block:'start'});},100);}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}
function openModal(cat,title,num){const s=getSmartStats(title,parseInt(num));const cover=getCoverForCat(cat);document.getElementById('modalCover').innerHTML=`<img src="${cover}" style="width:100%;height:100%;object-fit:contain;background:white"><div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.85);color:white;padding:8px;font-weight:900;font-size:12px;text-align:center">${title}</div>`;document.getElementById('modalBook').innerText=title;document.getElementById('modalStats').innerHTML=`<div class="flex gap-2 flex-wrap"><span class="bg-[#f6f6f6] px-3 py-1 rounded-full text-[11px] font-black">${s.stars} ${s.rating}</span><span class="bg-green-50 border px-3 py-1 rounded-full text-[11px] font-black">🔥 ${s.sales} ${t('sales')}</span><span class="bg-black text-white px-3 py-1 rounded-full text-[11px]">19 DH</span></div>`;document.getElementById('modalBuy').innerText=t('order_now');document.getElementById('modalBuy').onclick=()=>{window.open(`https://wa.me/${WA}?text=${encodeURIComponent(cat+" - "+title)}`,'_blank');};document.getElementById('modal').classList.remove('hidden');}
function doSearch(){let q=document.getElementById('searchInput').value.trim().toLowerCase();let res=document.getElementById('searchResult');let sugg=document.getElementById('suggestions');if(!q){window._searching=false;res.classList.add('hidden');sugg.classList.add('hidden');render();return;}let all=[];Object.keys(booksData[currentLang]).forEach(cat=>{booksData[currentLang][cat].forEach((title,idx)=>{if(title.toLowerCase().includes(q))all.push({cat,title,idx});});});if(all.length>0){sugg.classList.remove('hidden');sugg.innerHTML=all.slice(0,5).map(o=>`<div onclick="selectSuggestion('${o.title.replace(/'/g,"\\'")}')" class="px-4 py-3 hover:bg-zinc-100 cursor-pointer border-b"><p class="font-bold text-[13px]">${o.title}</p><p class="text-[10px] text-zinc-500">${o.cat}</p></div>`).join('');}else{sugg.classList.add('hidden');}window._searching=true;if(all.length>0){res.classList.remove('hidden');res.innerHTML=`${t('found')} <span class="bg-black text-white px-2 py-0.5 rounded-full">${all.length}</span> ${t('result')}`;document.getElementById('catInfo').innerText=`🔍 ${all.length} ${t('books')}`;document.getElementById('books').innerHTML=all.map(o=>{const cover=getCoverForCat(o.cat);return `<div onclick="openModal('${o.cat.replace(/'/g,"\\'")}','${o.title.replace(/'/g,"\\'")}','${o.idx}')" class="book-card border-2 border-black"><div class="flex justify-between px-2 py-1 bg-[#fafafa]"><span class="text-[8px] bg-black text-white px-2 py-1 rounded-full">${o.cat}</span><span class="text-[9px] bg-green-500 text-white px-2 py-1 rounded-full">19 DH</span></div><div class="book-cover"><img src="${cover}"><div class="book-cover-overlay"></div><div class="book-cover-title">${o.title}</div></div></div>`;}).join('');document.getElementById('discover').innerHTML='';}else{res.classList.remove('hidden');res.innerHTML=`❌ ${t('no_result')} "${q}"`;document.getElementById('books').innerHTML=`<div class="col-span-full text-center py-12 border-2 border-dashed rounded-[20px]"><p class="font-black">${t('no_result')} "${q}"</p><button onclick="clearSearch()" class="mt-3 bg-black text-white px-5 py-2 rounded-full text-[11px] font-black">↩️</button></div>`;}}
function selectSuggestion(title){document.getElementById('searchInput').value=title;document.getElementById('suggestions').classList.add('hidden');doSearch();}
function clearSearch(){document.getElementById('searchInput').value='';document.getElementById('suggestions').classList.add('hidden');window._searching=false;render();}
document.addEventListener('click',e=>{if(!e.target.closest('#searchInput')&&!e.target.closest('#suggestions'))document.getElementById('suggestions').classList.add('hidden');});
setLang(currentLang);
</script></body></html>
