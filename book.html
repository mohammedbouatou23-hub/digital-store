function getSmartStats(title,index){let hot=["chatgpt","midjourney","shopify","canva","tiktok","instagram","amazon","fba","funnel","ads","seo","ai ","notion","excel"].some(k=>title.toLowerCase().includes(k));if(hot||index<5){return{sales:310+Math.floor(Math.random()*210),rating:(4.8+Math.random()*0.2).toFixed(1),stars:"⭐⭐⭐⭐⭐",badge:"🔥"};}else if(index<15){return{sales:85+Math.floor(Math.random()*110),rating:(4.3+Math.random()*0.4).toFixed(1),stars:"⭐⭐⭐⭐",badge:"👍"};}else{return{sales:12+Math.floor(Math.random()*48),rating:(3.2+Math.random()*0.9).toFixed(1),stars:"⭐⭐⭐",badge:""};}}
function setLang(lang){currentLang=lang;localStorage.setItem('dm_lang',lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[id^=btn-]').forEach(b=>b.classList.remove('lang-active'));document.getElementById('btn-'+lang).classList.add('lang-active');active=Object.keys(booksData[currentLang])[0];currentPage=1;render();}
function render(){if(window._searching)return;
document.getElementById('cats').innerHTML=Object.keys(booksData[currentLang]).map(c=>{
  const cover=getCoverForCat(c);
  const isActive=c==active;
  return `<div onclick="setCat('${c.replace(/'/g,"\\'")}')" class="cursor-pointer rounded-[14px] overflow-hidden border-2 ${isActive?'border-black shadow-xl scale-[1.02]':'border-zinc-200'} transition-all hover:border-black bg-white">
    <div class="folder-img-wrap"><img src="${cover}" alt="${c}" loading="lazy"><div class="absolute bottom-0 left-0 right-0 p-2 text-white text-right bg-gradient-to-t from-black/70 to-transparent"><p class="font-black text-[11px] drop-shadow">${c}</p></div>${isActive?'<div class="absolute top-2 right-2 bg-white text-black text-[7px] font-black px-2 py-1 rounded-full">✓</div>':''}</div>
  </div>`;
}).join('');
const allBooks=booksData[currentLang][active];
const totalPages=Math.ceil(allBooks.length/booksPerPage);
const start=(currentPage-1)*booksPerPage;
const end=start+booksPerPage;
const booksToShow=allBooks.slice(start,end);
const activeCover=getCoverForCat(active);
document.getElementById('catInfo').innerHTML=`${active} <span class="bg-black text-white text-[10px] px-2 py-1 rounded-full">صفحة ${currentPage}/${totalPages}</span>`;
document.getElementById('books').innerHTML=
  booksToShow.map((t,i)=>{
    const realIndex=start+i;
    const s=getSmartStats(t,realIndex);
    return `<div onclick="openModal('${active.replace(/'/g,"\\'")}','${t.replace(/'/g,"\\'")}','${realIndex+1}')" class="book-card"><div class="flex justify-between px-3 py-2 bg-[#fafafa]"><span class="text-[9px] bg-white border px-2 py-1 rounded-full">#${realIndex+1} ${s.badge}</span><div class="flex items-center gap-1"><span class="text-[9px] line-through text-zinc-400">30 DH</span><span class="text-[10px] bg-green-500 text-white px-2 py-1 rounded-full font-black">19 DH</span></div></div><div class="book-cover"><img src="${activeCover}" loading="lazy"><div class="book-cover-overlay"></div><div class="book-cover-title">${t}</div></div><div class="p-2 flex justify-between items-center"><span class="text-[11px]">${s.stars} ${s.rating}</span><span class="text-[9px] bg-[#f6f6f6] px-2 py-0.5 rounded-full">${s.sales} ${i18n[currentLang].downloads}</span></div></div>`;
  }).join('') +
  `<div class="col-span-full mt-6 flex flex-col gap-3">
    <div class="flex justify-center items-center gap-2 flex-wrap">
      <button onclick="prevPage()" ${currentPage==1?'disabled':''} class="px-4 py-2 rounded-full border-2 text-[12px] font-black ${currentPage==1?'opacity-30':'border-black hover:bg-black hover:text-white'}">⬅️ السابق</button>
      ${Array.from({length:totalPages},(_,i)=>`<button onclick="goToPage(${i+1})" class="w-9 h-9 rounded-full text-[12px] font-black ${currentPage==i+1?'bg-black text-white':'border bg-white'}">${i+1}</button>`).join('')}
      <button onclick="nextPage()" ${currentPage==totalPages?'disabled':''} class="px-4 py-2 rounded-full border-2 text-[12px] font-black ${currentPage==totalPages?'opacity-30':'border-black hover:bg-black hover:text-white'}">التالي ➡️</button>
    </div>
    <div class="flex justify-center gap-2">
      <button onclick="scrollToCats()" class="bg-white border-2 border-black px-6 py-3 rounded-full font-black text-[12px]">⬆️ رجع للفئات</button>
      <button onclick="scrollToTop()" class="bg-black text-white px-6 py-3 rounded-full font-black text-[12px]">🏠 رجع للأول</button>
    </div>
    <p class="text-center text-[10px] text-zinc-400">كاين ${allBooks.length} كتاب - كتشوف ${start+1} حتى ${Math.min(end,allBooks.length)}</p>
  </div>`;
}
function setCat(c){active=c;currentPage=1;if(window._searching)clearSearch();render();setTimeout(()=>{document.getElementById('books').scrollIntoView({behavior:'smooth',block:'start'});},120);}
function nextPage(){const total=Math.ceil(booksData[currentLang][active].length/booksPerPage);if(currentPage<total){currentPage++;render();document.getElementById('books').scrollIntoView({behavior:'smooth'});}}
function prevPage(){if(currentPage>1){currentPage--;render();document.getElementById('books').scrollIntoView({behavior:'smooth'});}}
function goToPage(p){currentPage=p;render();document.getElementById('books').scrollIntoView({behavior:'smooth'});}
function scrollToCats(){document.getElementById('cats').scrollIntoView({behavior:'smooth',block:'start'});}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});currentPage=1;}
function openModal(cat,title,num){const s=getSmartStats(title,parseInt(num));const cover=getCoverForCat(cat);document.getElementById('modalCover').innerHTML=`<img src="${cover}" style="width:100%;height:100%;object-fit:contain;background:white"><div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.85);color:white;padding:8px;font-weight:900;font-size:12px;text-align:center">${title}</div>`;document.getElementById('modalBook').innerText=title;document.getElementById('modalStats').innerHTML=`<div class="flex flex-wrap gap-2 mt-2"><span class="bg-[#f6f6f6] px-3 py-1 rounded-full text-[11px] font-black">${s.stars} ${s.rating}</span><span class="bg-green-50 text-green-700 border px-3 py-1 rounded-full text-[11px] font-black">🔥 ${s.sales} مبيعة</span><span class="bg-black text-white px-3 py-1 rounded-full text-[11px] font-black">19 DH</span></div>`;document.getElementById('modalBuy').innerText="اطلب دابا - 19 DH ↗";document.getElementById('modalBuy').onclick=()=>{window.open(`https://wa.me/${WA}?text=${encodeURIComponent(cat+" - "+title+" - 19 DH")}`,'_blank');};document.getElementById('modal').classList.remove('hidden');}
function doSearch(){let q=document.getElementById('searchInput').value.trim().toLowerCase();let resultInfo=document.getElementById('searchResult');let suggBox=document.getElementById('suggestions');if(q.length===0){window._searching=false;resultInfo.classList.add('hidden');suggBox.classList.add('hidden');render();return;}let allBooks=[];Object.keys(booksData[currentLang]).forEach(cat=>{booksData[currentLang][cat].forEach((title,idx)=>{if(title.toLowerCase().includes(q)){allBooks.push({cat,title,idx});}});});if(allBooks.length>0){suggBox.classList.remove('hidden');suggBox.innerHTML=allBooks.slice(0,5).map(obj=>`<div onclick="selectSuggestion('${obj.title.replace(/'/g,"\\'")}')" class="px-4 py-3 hover:bg-zinc-100 cursor-pointer border-b last:border-0"><p class="font-bold text-[13px]">${obj.title}</p><p class="text-[10px] text-zinc-500">${obj.cat}</p></div>`).join('');}else{suggBox.classList.add('hidden');}window._searching=true;if(allBooks.length>0){resultInfo.classList.remove('hidden');resultInfo.innerHTML=`لقينا <span class="bg-black text-white px-2 py-0.5 rounded-full">${allBooks.length}</span> نتيجة`;document.getElementById('catInfo').innerText=`🔍 ${allBooks.length} كتاب`;document.getElementById('books').innerHTML=allBooks.map(obj=>{const s=getSmartStats(obj.title,obj.idx);const cover=getCoverForCat(obj.cat);return `<div onclick="openModal('${obj.cat.replace(/'/g,"\\'")}','${obj.title.replace(/'/g,"\\'")}','${obj.idx}')" class="book-card border-2 border-black"><div class="flex justify-between px-3 py-2 bg-[#fafafa]"><span class="text-[8px] bg-black text-white px-2 py-1 rounded-full">${obj.cat}</span><span class="text-[10px] bg-green-500 text-white px-2 py-1 rounded-full font-black">19 DH</span></div><div class="book-cover"><img src="${cover}"><div class="book-cover-overlay"></div><div class="book-cover-title">${obj.title}</div></div></div>`;}).join('');}else{resultInfo.classList.remove('hidden');resultInfo.innerHTML=`❌ ما لقيناش "${q}"`;document.getElementById('books').innerHTML=`<div class="col-span-full text-center py-12 border-2 border-dashed rounded-[20px]"><p class="font-black">😔 ما لقيناش "${q}"</p><button onclick="clearSearch()" class="mt-3 bg-black text-white px-5 py-2 rounded-full text-[11px] font-black">مسح البحث</button></div>`;}}
function selectSuggestion(title){document.getElementById('searchInput').value=title;document.getElementById('suggestions').classList.add('hidden');doSearch();}
function clearSearch(){document.getElementById('searchInput').value='';document.getElementById('suggestions').classList.add('hidden');window._searching=false;render();}
document.addEventListener('click',e=>{if(!e.target.closest('#searchInput')&&!e.target.closest('#suggestions')){document.getElementById('suggestions').classList.add('hidden');}});
setLang(currentLang);
</script></body></html>
